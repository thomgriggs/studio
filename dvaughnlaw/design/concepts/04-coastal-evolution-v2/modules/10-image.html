{#
MODULE: image
PURPOSE: A single photo that stands on its own, at the full content width, square-cornered.
SLOTS: image (src, alt).
SQUARESPACE: Section with one Image block (fluid or wide). No code.
#}
<section class="m m-image" data-module="image" data-tone="{{ tone }}">
  <div class="wrap"><figure><img src="{{ s.image.src }}" alt="{{ s.image.alt }}" loading="lazy"></figure></div>
</section>
