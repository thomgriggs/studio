{#
MODULE: quote-tile
PURPOSE: A real quotation with attribution in the original's italic pull-quote style.
SLOTS: text, attribution.
SQUARESPACE: Quote block (native).
#}
<section class="m m-quote" data-module="quote-tile" data-tone="{{ tone }}"><figure><blockquote class="pull">{{ s.text|md }}</blockquote>{% if s.attribution %}<figcaption class="pull__by">— {{ s.attribution|md }}</figcaption>{% endif %}</figure></section>
