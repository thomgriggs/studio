{#
MODULE: review-line
PURPOSE: One line of client praise with reviewer and source (defined, unused: the crawl has no client reviews). The big centred quote with a small-caps byline.
SLOTS: text, author, source, rating, href.
SQUARESPACE: Quote block or Testimonials block.
#}
<section class="m m-quote" data-module="review-line" data-tone="{{ tone }}"><figure><blockquote class="pull">&ldquo;{{ s.text|md }}&rdquo;</blockquote><figcaption class="pull__by">{{ s.author }}{% if s.source %}, {{ s.source }}{% endif %}</figcaption></figure></section>
