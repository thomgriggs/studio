<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="studio:project" content="SwabPro">
  <meta name="studio:description" content="Final SwabPro marketing projects for TLC Medical.">
  <title>SwabPro — Studio</title>
  <link rel="stylesheet" href="/assets/breadcrumb.css">
  <script defer src="/assets/breadcrumb.js"></script>
  <style>
    :root{--bg:#f7f6fb;--ink:#211664;--muted:#6e6982;--line:#ded9ee;--card:#fff;--accent:#4a35aa;--soft:#eeeafd}
    *{box-sizing:border-box}body{margin:0;background-color:var(--bg);background-image:radial-gradient(circle at 85% 5%,#ebe6ff 0,rgba(235,230,255,0) 34%);background-repeat:no-repeat;background-size:100% 620px;color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{width:min(980px,calc(100% - 40px));margin:auto;padding:72px 0 84px}.path{margin:0 0 44px;color:var(--muted);font-size:14px}.path a{color:var(--muted);text-decoration:none}.path a:hover{color:var(--accent)}.path span{margin:0 8px;color:#aaa3bd}.eyebrow{margin:0 0 12px;color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}h1{margin:0 0 18px;font-size:clamp(50px,9vw,92px);line-height:.92;letter-spacing:-.05em}.intro{max-width:650px;margin:0 0 44px;color:var(--muted);font-size:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{display:flex;min-height:220px;padding:28px;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.9);color:inherit;text-decoration:none;flex-direction:column;transition:.2s}.card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 20px 48px rgba(33,22,100,.1)}.number{width:40px;height:40px;margin-bottom:auto;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--accent);font-weight:800}.card strong{display:block;margin:34px 0 8px;font-size:30px;line-height:1}.card small{color:var(--muted);font-size:15px}@media(max-width:700px){.grid{grid-template-columns:1fr}.card{min-height:180px}}
  </style>
</head>
<body>
  <main class="wrap">
    <nav class="path" aria-label="Breadcrumb"><a href="/tlcmedical/">TLC Medical</a><span>&gt;</span><strong>SwabPro</strong></nav>
    <p class="eyebrow">TLC Medical</p>
    <h1>SwabPro.</h1>
    <p class="intro">Final production artwork for the SwabPro brochure and swing tag.</p>
    <div class="grid">
      <a class="card" href="./brochure/"><span class="number">01</span><strong>Brochure</strong><small>View the final two-page print PDF</small></a>
      <a class="card" href="./swingtag/"><span class="number">02</span><strong>Swing Tag</strong><small>View the final two-sided print PDF</small></a>
    </div>
  </main>
</body>
</html>
