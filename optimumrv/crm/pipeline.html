<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
	<meta name="studio:project" content="Optimum RV CRM">
	<meta name="studio:description" content="Pipeline — kanban by stage.">
	<title>Pipeline — Optimum RV CRM</title>
	<link rel="icon" href="https://optimumrv.com/favicon.svg" type="image/svg+xml">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="crm.css">
</head>
<body data-view="pipeline" data-role="sales" data-desk="default">

	<!-- ===== SVG SPRITE : RV line-art placeholders ===== -->
	<svg hidden aria-hidden="true">
		<symbol id="rv-trailer" viewBox="0 0 64 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
			<path d="M6 22V10a4 4 0 0 1 4-4h34a4 4 0 0 1 4 4v12H6z"/><path d="M48 16h8l4 6H48"/><rect x="12" y="10" width="8" height="6" rx="1"/><rect x="26" y="10" width="8" height="6" rx="1"/><circle cx="20" cy="25" r="3"/><circle cx="36" cy="25" r="3"/><path d="M2 22h4"/>
		</symbol>
		<symbol id="rv-motorhome" viewBox="0 0 64 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
			<path d="M4 23V9a3 3 0 0 1 3-3h40l13 8v9H4z"/><rect x="10" y="10" width="9" height="6" rx="1"/><rect x="24" y="10" width="9" height="6" rx="1"/><path d="M47 6v8h13"/><circle cx="16" cy="25" r="3"/><circle cx="48" cy="25" r="3"/>
		</symbol>
	</svg>

	<!-- ===== ROLE SWITCH : prototype-only bar (remove in production) ===== -->
	<nav class="role-switch" aria-label="Prototype role"></nav>

	<!-- ===== SIDEBAR NAVIGATION ===== -->
	<aside class="sidebar-navigation" id="sidebar-navigation" aria-hidden="true" aria-label="Main navigation">
		<div class="sidebar-navigation-head">
			<button type="button" class="menu-btn sidebar-navigation-close" data-action="close-menu" aria-label="Close menu"><i data-feather="x"></i></button>
			<a class="brand" href="index.html"><img src="assets/optimumrvlogo.svg" alt="Optimum RV" width="209" height="50"></a>
		</div>
		<nav class="primary-navigation" aria-label="Views">
			<a class="nav-item" data-view="daily-view" href="daily-view.html"><i data-feather="message-circle"></i><span>Daily View</span></a>
			<a class="nav-item" data-view="calendar" href="calendar.html"><i data-feather="calendar"></i><span>Calendar</span></a>
			<a class="nav-item" data-view="pipeline" href="pipeline.html"><i data-feather="columns"></i><span>Pipeline</span></a>
		</nav>
		<div class="sidebar-footer">
			<div class="user-card">
				<span class="avatar avatar-small" data-field="user.initials">RM</span>
				<div><strong data-field="user.name">Riley Morgan</strong><small data-field="user.location">Ocala, FL</small></div>
			</div>
			<a class="nav-item" href="#" data-action="open-settings"><i data-feather="settings"></i><span>Settings</span></a>
			<a class="nav-item" href="#" data-action="open-help"><i data-feather="help-circle"></i><span>Help center</span></a>
			<a class="nav-item" href="index.html" data-action="sign-out"><i data-feather="log-out"></i><span>Sign out</span></a>
			<label class="dev-toggle"><input type="checkbox" data-action="toggle-labels"> Show block labels (handoff aid)</label>
			<small class="version" data-field="app.version">Version 1.2</small>
		</div>
	</aside>
	<div class="global-overlay"></div>

	<!-- ===== TOPBAR : menu, title, new lead, desk toggle, filters, search ===== -->
	<header class="topbar">
		<button type="button" class="menu-btn" data-action="open-menu" aria-label="Open menu" aria-controls="sidebar-navigation"><i data-feather="menu"></i></button>
		<h1 class="page-title">Pipeline</h1>
		<button type="button" class="btn btn-primary btn-round" data-action="new-lead" aria-label="New lead"><i data-feather="plus"></i></button>
		<!-- PIPELINE TOGGLE : Consign / Back Office (consignment role only) -->
		<div class="pipeline-toggle" hidden><div class="segmented" role="group" aria-label="Board"></div></div>
		<div class="topbar-context">
			<!-- PIPELINE FILTERS : location / owner / waiting-on — rendered per desk -->
			<div class="pipeline-filters"></div>
			<form class="field global-search" role="search" onsubmit="return false"><i data-feather="search"></i><label class="sr-only" for="global-search-input">Search</label><input id="global-search-input" type="search" placeholder="Search" data-action="search-board"></form>
		</div>
	</header>

	<!-- ===== PIPELINE : one .pipeline-column per stage, cards inside ===== -->
	<main class="pipeline" id="pipeline" aria-label="Pipeline board"></main>

	<!-- ===== TEMPLATES ===== -->
	<template id="tpl-pipeline-column">
		<section class="pipeline-column" data-stage="">
			<header class="column-header"><span class="stage-dot"></span><h2 data-field="stage.label"></h2><span class="column-count" data-field="stage.count"></span></header>
			<div class="column-body"></div>
		</section>
	</template>

	<template id="tpl-lead-card">
		<article class="lead-card" data-lead="" data-stage="" data-owner="">
			<span class="card-owner" data-field="owner"></span>
			<button type="button" class="card-body" data-action="quick-edit">
				<span class="card-head">
					<span class="card-name"><span class="card-unread" data-status="" hidden></span><span data-field="name"></span></span>
					<span class="pill card-timer" data-status=""></span>
				</span>
				<span class="card-unit"><span class="thumb"></span><span class="card-unit-title" data-field="unit"></span><span class="card-price" data-field="card.price"></span></span>
				<span class="card-badges"></span>
				<span class="card-source"><span data-field="card.source"></span> · <span data-field="card.type"></span><span class="card-loc" data-field="card.loc"></span></span>
				<span class="card-activity"><i data-feather="message-circle"></i><span data-field="card.activity"></span><time data-field="card.age"></time></span>
			</button>
			<p class="card-flag" data-tone=""></p>
		</article>
	</template>

	<template id="tpl-forsale-summary">
		<div class="forsale-summary">
			<p class="summary-label" data-field="buckets.label"></p>
			<div class="bucket-list"></div>
			<p class="summary-label" data-field="queues.label"></p>
			<div class="queue-list"></div>
		</div>
	</template>

	<script src="js/feather.min.js"></script>
	<script src="js/micromodal.min.js"></script>
	<script src="data.js"></script>
	<script src="crm.js"></script>
</body>
</html>
