<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
	<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
	<meta name="studio:project" content="Optimum RV CRM">
	<meta name="studio:description" content="Calendar — appointments and follow-ups.">
	<title>Calendar — Optimum RV CRM</title>
	<link rel="icon" href="https://optimumrv.com/favicon.svg" type="image/svg+xml">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="crm.css">
</head>
<body data-view="calendar" data-role="sales" data-desk="default">

	<!-- ===== SVG SPRITE : RV line-art placeholders ===== -->
	<svg hidden aria-hidden="true">
		<symbol id="rv-trailer" viewBox="0 0 64 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
			<path d="M6 22V10a4 4 0 0 1 4-4h34a4 4 0 0 1 4 4v12H6z"/><path d="M48 16h8l4 6H48"/><rect x="12" y="10" width="8" height="6" rx="1"/><rect x="26" y="10" width="8" height="6" rx="1"/><circle cx="20" cy="25" r="3"/><circle cx="36" cy="25" r="3"/><path d="M2 22h4"/>
		</symbol>
		<symbol id="rv-motorhome" viewBox="0 0 64 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
			<path d="M4 23V9a3 3 0 0 1 3-3h40l13 8v9H4z"/><rect x="10" y="10" width="9" height="6" rx="1"/><rect x="24" y="10" width="9" height="6" rx="1"/><path d="M47 6v8h13"/><circle cx="16" cy="25" r="3"/><circle cx="48" cy="25" r="3"/>
		</symbol>
	</svg>


	<!-- ===== SIDEBAR NAVIGATION ===== -->
	<aside class="sidebar-navigation" id="sidebar-navigation" aria-hidden="true" inert aria-label="Main navigation">
		<div class="sidebar-navigation-head">
			<button type="button" class="menu-btn sidebar-navigation-close" data-action="close-menu" aria-label="Close menu"><i data-feather="x"></i></button>
			<a class="brand" href="index.html"><img src="assets/optimumrvlogo.svg" alt="Optimum RV" width="209" height="50"></a>
		</div>
		<nav class="primary-navigation" aria-label="Views">
			<a class="nav-item" data-view="daily-view" href="daily-view.html"><i data-feather="message-circle"></i><span>Daily View</span></a>
			<a class="nav-item" data-view="calendar" href="calendar.html"><i data-feather="calendar"></i><span>Calendar</span></a>
			<a class="nav-item" data-view="pipeline" href="pipeline.html"><i data-feather="columns"></i><span>Pipeline</span></a>
		</nav>
		<div class="sidebar-footer">
			<div class="user-card">
				<span class="avatar avatar-small" data-field="user.initials">RM</span>
				<div><strong data-field="user.name">Riley Morgan</strong><small data-field="user.location">Ocala, FL</small></div>
			</div>
			<a class="nav-item" href="#" data-action="open-settings"><i data-feather="settings"></i><span>Settings</span></a>
			<a class="nav-item" href="#" data-action="open-help"><i data-feather="help-circle"></i><span>Help center</span></a>
			<a class="nav-item" href="index.html" data-action="sign-out"><i data-feather="log-out"></i><span>Sign out</span></a>
			<small class="version" data-field="app.version">Version 1.2</small>
		</div>
	</aside>
	<div class="global-overlay"></div>

	<!-- ===== TOPBAR : menu · title · new · view modes · context · search ===== -->
	<header class="topbar">
		<button type="button" class="menu-btn" data-action="open-menu" aria-label="Open menu" aria-controls="sidebar-navigation"><i data-feather="menu"></i></button>
		<h1 class="page-title sr-only">Calendar</h1>
		<!-- CALENDAR TITLE : the current range (‹ Today › live in the sidebar) -->
		<div class="calendar-nav"><span class="calendar-title" data-field="calendar.title">September 2026</span></div>
		<button type="button" class="btn btn-primary btn-round" data-action="new-event" aria-label="New appointment or follow-up"><i data-feather="plus"></i></button>
		<!-- CALENDAR MODES : Day / Week / Month / Year (keys d w m y) -->
		<div class="calendar-modes">
			<div class="segmented" role="group" aria-label="Calendar view">
				<button type="button" data-mode="day" data-action="calendar-mode-day">Day</button>
				<button type="button" class="is-active is-brand" data-mode="week" data-action="calendar-mode-week">Week</button>
				<button type="button" data-mode="month" data-action="calendar-mode-month">Month</button>
				<button type="button" data-mode="year" data-action="calendar-mode-year">Year</button>
			</div>
		</div>
		<div class="topbar-context">
			<!-- CALENDAR FILTERS : location (management) or store pill -->
			<div class="pipeline-filters calendar-filters"></div>
			<form class="field global-search" role="search" onsubmit="return false"><button type="button" class="global-search-toggle" data-action="search-expand" aria-label="Search" aria-expanded="false"><i data-feather="search"></i></button><label class="sr-only" for="global-search-input">Search</label><input id="global-search-input" type="search" placeholder="Search" data-action="search-calendar"></form>
		</div>
	</header>

	<!-- ===== CALENDAR : sidebar + main; data-mode drives which view renders ===== -->
	<main class="calendar" id="calendar" data-mode="week" aria-label="Calendar">

		<!-- CALENDAR SIDEBAR : mini month for jumping dates, and the calendars you can show/hide -->
		<aside class="calendar-sidebar" aria-label="Calendar sidebar">
			<!-- SIDEBAR NAV : previous / today / next for the current range (day, week, month or year) -->
			<div class="sidebar-nav">
				<button type="button" class="menu-btn" data-action="cal-prev" aria-label="Previous"><i data-feather="chevron-left"></i></button>
				<button type="button" class="btn" data-action="cal-today">Today</button>
				<button type="button" class="menu-btn" data-action="cal-next" aria-label="Next"><i data-feather="chevron-right"></i></button>
			</div>
			<div id="mini-month"></div>
			<section class="calendar-list-group">
				<h2>Activity</h2>
				<div class="calendar-list">
					<label class="calendar-list-item"><input type="checkbox" checked data-action="toggle-calendar" data-category="appointment"><span class="swatch" data-category="appointment"></span>Appointments</label>
					<label class="calendar-list-item"><input type="checkbox" checked data-action="toggle-calendar" data-category="logistics"><span class="swatch" data-category="logistics"></span>Deliveries &amp; drop-offs</label>
					<label class="calendar-list-item"><input type="checkbox" checked data-action="toggle-followups" data-category="followup"><span class="swatch" data-category="followup"></span>Follow-ups</label>
				</div>
			</section>
			<section class="calendar-list-group" id="calendar-owners" hidden>
				<h2>Salespeople</h2>
				<div class="calendar-list"></div>
			</section>
		</aside>

		<!-- CALENDAR MAIN : the active view -->
		<div class="calendar-main">
			<div class="calendar-scroll" id="calendar-scroll">
				<!-- CALENDAR HEAD : day-of-week labels (click a day to open it) -->
				<div class="calendar-head"><span></span></div>
				<!-- CALENDAR GRID : time gutter + day columns; events absolutely positioned by start/end; double-click empty space to add -->
				<div class="calendar-grid" id="calendar-grid"><div class="calendar-times"></div></div>
			</div>
			<!-- DAY AGENDA : Notion-style list of the day's items with inline actions -->
			<section class="day-agenda" id="day-agenda" hidden aria-label="Agenda"></section>
			<!-- CALENDAR MONTH : iCal-style grid; click a date to open the day, empty space to add -->
			<div class="calendar-month" id="calendar-month" hidden></div>
			<!-- CALENDAR YEAR : twelve mini months; click a day or a month name -->
			<div class="calendar-year" id="calendar-year" hidden></div>
		</div>
	</main>

	<!-- ===== PHONE CALENDAR : iOS Calendar day mode — top bar · week strip · agenda · bottom bar ===== -->
	<main class="phone-cal" data-phone aria-label="Calendar">
		<header class="phone-topbar">
			<button type="button" class="menu-btn" data-action="open-menu" aria-label="Open menu" aria-controls="sidebar-navigation"><i data-feather="menu"></i></button>
			<button type="button" class="phone-month-title" data-action="phone-month-toggle"><i data-feather="chevron-left"></i><span data-field="calendar.month">September</span></button>
			<span class="phone-actions">
				<button type="button" class="menu-btn phone-cal-stores" data-action="phone-cal-stores" aria-label="Stores" aria-haspopup="menu" hidden><i data-feather="map-pin"></i></button>
				<button type="button" class="menu-btn phone-cal-filter" data-action="phone-cal-filter" aria-label="Filter" aria-haspopup="menu"><i data-feather="filter"></i><span class="phone-filter-dot" hidden></span></button>
				<button type="button" class="menu-btn" data-action="new-event" aria-label="New appointment"><i data-feather="plus"></i></button>
			</span>
		</header>
		<!-- PHONE MONTH : drops down from the title; pick a day, it collapses -->
		<div class="phone-month" id="phone-month" hidden></div>
		<!-- PHONE WEEK : Sun–Sat strip; swipe for the next week; Today pill when you're away from today -->
		<div class="phone-week" id="phone-week"></div>
		<!-- PHONE AGENDA : the selected day's items in order; swipe left/right for the next/previous day -->
		<section class="phone-agenda" id="phone-agenda"></section>
		<footer class="phone-bottombar">
			<button type="button" class="btn phone-today" data-action="cal-today">Today</button>
			<form class="field phone-search" role="search" onsubmit="return false">
				<i data-feather="search"></i>
				<label class="sr-only" for="phone-cal-search">Search</label>
				<input id="phone-cal-search" type="search" placeholder="Search" autocomplete="off" data-action="search-calendar">
			</form>
			<button type="button" class="btn btn-icon phone-compose" data-action="new-event" aria-label="New appointment"><i data-feather="edit"></i></button>
		</footer>
	</main>
	<!-- ===== PHONE EVENT : full-screen event card (the same inline-editable card as the desktop popover) ===== -->
	<section class="phone-event" data-phone aria-label="Event">
		<header class="phone-topbar">
			<button type="button" class="menu-btn phone-back" data-action="phone-back" aria-label="Back to the day"><i data-feather="chevron-left"></i></button>
			<button type="button" class="phone-lead" data-action="open-lead-details"><span class="avatar avatar-small" data-field="initials"></span><span class="phone-lead-name" data-field="name"></span></button>
			<span class="phone-actions"><button type="button" class="menu-btn" data-action="phone-event-more" aria-label="More actions" aria-haspopup="menu"><i data-feather="more-horizontal"></i></button></span>
		</header>
		<div class="phone-event-body" id="phone-event-body"></div>
	</section>

	<!-- ===== EVENT POPOVER : iCal-style card anchored to the clicked event ===== -->
	<div class="event-popover" id="event-popover" hidden role="dialog" aria-label="Event"></div>


	<!-- ===== TEMPLATES ===== -->
	<template id="tpl-calendar-event">
		<button type="button" class="calendar-event" data-event="" data-lead="" data-owner="" data-category="" data-action="open-event">
			<span class="event-owner"><span data-field="owner"></span></span>
			<span class="event-body">
				<span class="thumb"></span>
				<span class="event-text">
					<span class="event-name" data-field="name"></span>
					<span class="event-unit" data-field="unit"></span>
					<span class="event-meta"><span data-field="type"></span> · <span data-field="timeLabel"></span></span>
				</span>
			</span>
			<span class="event-done" hidden><i data-feather="check"></i></span>
		</button>
	</template>

	<template id="tpl-followup-task">
		<label class="followup-task" data-event="" data-lead="" data-status="">
			<input type="checkbox" data-action="complete-followup">
			<span data-field="label"></span>
		</label>
	</template>

	<script src="js/feather.min.js"></script>
	<script src="js/micromodal.min.js"></script>
	<script src="data.js"></script>
	<script src="crm.js"></script>
</body>
</html>
