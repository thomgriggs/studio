<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
	<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
	<title>Toast preview — Optimum RV CRM</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="crm.css">
	<style>
		/* ---- preview page only ---- */
		body { display:grid; place-items:center; min-height:100dvh; padding:24px; }
		.preview { display:grid; gap:14px; max-width:460px; width:100%; }
		.preview h1 { font-family:var(--font_name-secondary); font-size:var(--font_size-large); }
		.preview p { color:var(--color_text-muted); font-size:var(--font_size-small); }
		.preview .btn { justify-content:flex-start; height:44px; }
		.preview .row { display:flex; gap:10px; flex-wrap:wrap; }

		/* the toast itself lives in crm.css / crm.js — this page only calls crmToast() */
	</style>
</head>
<body data-view="preview" data-device="desktop">
	<main class="preview">
		<h1>Toast preview</h1>
		<p>Each button does what the real one would, then shows the confirmation. It fades after 4 seconds, or click it to dismiss. A screen reader hears the same words.</p>
		<div class="row">
			<button type="button" class="btn" data-msg="Marcus Trent moved to Agreed" data-undo="1"><i data-feather="check-circle"></i>Mark agreed</button>
			<button type="button" class="btn" data-msg="Sent"><i data-feather="send"></i>Send message</button>
			<button type="button" class="btn" data-msg="Appointment saved · Fri, Sep 25 · 3 PM" data-undo="1"><i data-feather="calendar"></i>Save appointment</button>
			<button type="button" class="btn" data-msg="Follow-up done" data-undo="1"><i data-feather="check"></i>Complete follow-up</button>
			<button type="button" class="btn" data-msg="Type a message first" data-tone="warn"><i data-feather="alert-circle"></i>Send (empty)</button>
			<button type="button" class="btn" data-msg="Showing all stores"><i data-feather="filter"></i>Clear filters</button>
		</div>
		<p>Position: bottom-centre. On the Daily View it would sit just above the composer; on the phone, above the bottom bar.</p>
	</main>


	<script src="js/feather.min.js"></script>
	<script src="js/micromodal.min.js"></script>
	<script src="data.js"></script>
	<script src="crm.js"></script>
	<script>
		document.querySelectorAll('[data-msg]').forEach(b => b.addEventListener('click', () => crmToast(b.dataset.msg, { tone:b.dataset.tone, undo:b.dataset.undo ? () => crmToast('Undone') : null })));
		feather.replace();
	</script>
</body>
</html>
